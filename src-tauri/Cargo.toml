[package]
name = "viary"
version = "0.1.0"
description = "Hold a key, speak, and Viary types it for you."
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "viary_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
speechkit = { version = "0.3", features = ["sherpa", "openai", "dashscope", "capture"] }
# Blocking HTTP for the polish model, called from worker threads.
ureq = { version = "2.12", features = ["json"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSData"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication", "NSPasteboard", "NSPasteboardItem", "NSWindow", "NSResponder", "NSApplication"] }
security-framework = "3"

[profile.dev.package.rubato]
opt-level = 3
