[package]
name = "viary"
version = "0.1.0"
description = "Hold a key, speak, and Viary types it for you."
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "viary_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
speechkit = { version = "0.5.0", features = ["sherpa", "openai", "dashscope", "devices", "decode"] }
# Resampling voice notes to one rate; the version speechkit uses.
rubato = { version = "5", default-features = false }
# Blocking HTTP for the polish model, called from worker threads.
ureq = { version = "2.12", features = ["json"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSData", "NSURL", "NSObject"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication", "NSPasteboard", "NSPasteboardItem", "NSWindow", "NSResponder", "NSApplication", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSDragging"] }
security-framework = "3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
clipboard-win = "5"
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
# The talk shortcut (GlobalShortcuts) and typing on Wayland (RemoteDesktop).
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts", "remote_desktop"] }
# The clipboard, through X11 (XWayland on a Wayland session).
arboard = { version = "3", default-features = false }
# Typing and the active window on an X11 session.
x11rb = { version = "0.13", features = ["xtest"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync"] }

[profile.dev.package.rubato]
opt-level = 3
