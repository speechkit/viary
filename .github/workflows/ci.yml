name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libdbus-1-dev libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Type-checks the web views and writes dist/, which the Rust build embeds.
      - run: npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        working-directory: src-tauri
        run: cargo test

      # A headless GNOME Shell on Wayland, as Ubuntu 26.04 runs it, with
      # Viary's extension and the desktop portals.
      - name: GNOME packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y gnome-shell mutter xwayland dbus-daemon dconf-service \
            xdg-desktop-portal xdg-desktop-portal-gnome libgl1-mesa-dri
      - name: GNOME on Wayland
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: dbus-run-session -- ci/gnome-wayland.sh
